[project]
name = "bess"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.0"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "ruff>=0.16.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bess"]  # Strictly limits setuptools to the bess folder

[tool.uv.sources]
bess = { path = ".", editable = true }
